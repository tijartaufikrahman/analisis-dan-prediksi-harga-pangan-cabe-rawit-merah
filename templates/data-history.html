{% extends "layout.html" %}
{% block title %}Data Histori{% endblock %}

{% block content %}

<div class="row mt-3">
    <div class="col-12">
        <h4>Data Histori</h4>
    </div>
</div>

<div class="row mt-3">
    <div class="col-12 ">
        <div class="card shadow-sm border-0 p-2 pt-0">
            <div class="card-body">
                <div class="row align-items-end">

                    <div class="col-4">
                        <label class="form-label">Pilih File Data</label>
                        <select id="fileSelect" class="form-control">
                            <option value="">-- Pilih File --</option>
                        </select>
                    </div>

                    <div id="select-type" class="col-3 d-none" >
                        <label class="form-label">Tipe Data</label>
                        <select id="modeSelect" class="form-control">
                            <option value="bulanan" selected>
                                Rata-Rata Bulanan
                            </option>
                            <option value="harian">
                                Harian
                            </option>
                        </select>

                    </div>

                    <div class="col-3">
                        <button id="btnProses" class="btn text-white" style="background-color: #0093AD;">
                            Tampilkan Data
                        </button>
                    </div>

                </div>
            </div>
        </div>
    </div>
</div>



<div class="row mt-3">
    <div class="col-12">
        <div class="card shadow-sm border-0 p-3">
            <div class="card-body">
                <table id="historyTable" class="table table-bordered table-striped w-100"></table>
            </div>
        </div>
    </div>
</div>



{% endblock %}

{% block scripts %}

<script src="https://cdnjs.cloudflare.com/ajax/libs/twitter-bootstrap/5.3.3/js/bootstrap.bundle.min.js"></script>
<script src="https://cdn.datatables.net/2.3.5/js/dataTables.js"></script>
<script src="https://cdn.datatables.net/2.3.5/js/dataTables.bootstrap5.js"></script>



<!-- Data Table CSS -->
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/twitter-bootstrap/5.3.3/css/bootstrap.min.css">
<link rel="stylesheet" href="https://cdn.datatables.net/2.3.5/css/dataTables.bootstrap5.css">

<script>

let table;

$(document).ready(function(){

    loadFiles();

    $("#btnProses").click(function(){
        loadData();
    });

});


// =============================
// LOAD FILE LIST
// =============================
function loadFiles(){

    $.get("/api/history/files", function(response){

        let select = $("#fileSelect");
        select.empty();
        select.append('<option value="">-- Pilih File --</option>');

        response.forEach(function(file){
            select.append(`<option value="${file}">${file}</option>`);
        });

    });
}


// =============================
// LOAD DATA
// =============================
function loadData(){

    let file = $("#fileSelect").val();
    let mode = $("#modeSelect").val();

    if(!file){
        alert("Silakan pilih file dulu");
        return;
    }

    $.ajax({
        url: "/api/history/load",
        method: "POST",
        contentType: "application/json",
        data: JSON.stringify({
            file: file,
            mode: mode
        }),
        success: function(response){

            if(!response.success){
                alert(response.message);
                return;
            }

            $('#select-type').removeClass('d-none');
            renderTable(response.columns, response.data);
        }
    });

}


// =============================
// RENDER TABLE DINAMIS
// =============================
function renderTable(columns, data){

    if ($.fn.DataTable.isDataTable('#historyTable')) {
        $('#historyTable').DataTable().destroy();
    }

    $("#historyTable").empty();

    let useAutoNumber = !columns.includes("No");

    // =========================
    // UBAH NAMA KOLOM
    // =========================
    let displayColumns = columns.map(col => {
        if(col === "Kota / Kelurahan"){
            return "Kota / Kabupaten";
        }
        if(col === "Harga"){
            return "Harga Rata-Rata";
        }
        return col;
    });

    // =========================
    // HEADER
    // =========================
    let thead = "<thead><tr>";

    if(useAutoNumber){
        thead += "<th class='text-center'>No</th>";
    }

    displayColumns.forEach(col => {
        thead += `<th class='text-center'>${col}</th>`;
    });

    thead += "</tr></thead>";

    $("#historyTable").append(thead);

    // =========================
    // DATA
    // =========================
    let tableData = data.map((row, index) => {

        let arr = [];

        if(useAutoNumber){
            arr.push(index + 1);
        }

        columns.forEach(col => {
            arr.push(row[col]);
        });

        return arr;
    });

    table = $('#historyTable').DataTable({
        data: tableData,
        pageLength: 10,
        responsive: true,
        columnDefs: [
            {
                targets: "_all",
                className: "text-center"
            }
        ]
    });

}


</script>

{% endblock %}
